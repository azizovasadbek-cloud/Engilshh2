<!doctype html><html lang="uz"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111827"><link rel="manifest" href="manifest.json">
<title>English 2H Ultimate v2</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--ink:#111827;--muted:#64748b;--line:#e2e8f0;--accent:#2563eb;--ok:#16a34a;--bad:#dc2626}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--ink)}
header{background:#111827;color:#fff;padding:18px;position:sticky;top:0;z-index:5}.top{max-width:1100px;margin:auto;display:flex;justify-content:space-between;align-items:center}
h1{font-size:20px;margin:0}.sub{font-size:12px;color:#cbd5e1}.main{max-width:1100px;margin:auto;padding:16px}
.nav{display:flex;gap:7px;overflow:auto;margin-bottom:14px}.nav button{white-space:nowrap}
button{border:0;border-radius:10px;padding:10px 13px;background:var(--accent);color:#fff;font-weight:650;cursor:pointer}
button.secondary{background:#e2e8f0;color:#0f172a}.ok{background:var(--ok)}.bad{background:var(--bad)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px}
.item{border:1px solid var(--line);border-radius:12px;padding:10px;margin:8px 0}.muted{color:var(--muted)}.pill{display:inline-block;background:#eff6ff;color:#1d4ed8;padding:4px 8px;border-radius:999px;font-size:12px;margin:2px}
.big{font-size:32px;font-weight:800}.progress{height:10px;background:#e2e8f0;border-radius:99px;overflow:hidden}.bar{height:100%;background:var(--accent);width:0}
.hidden{display:none}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.list{display:grid;gap:8px}
input,select{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:#fff}label{font-size:12px;color:var(--muted)}
.timer{font-size:42px;font-weight:800;text-align:center}footer{text-align:center;padding:30px;color:var(--muted);font-size:12px}
</style></head><body>
<header><div class="top"><div><h1>English 2H Ultimate v2</h1><div class="sub">224 kun · Beginner → Pre-Intermediate · Audio-first</div></div><div id="streak">🔥 0</div></div></header>
<main class="main">
<div class="nav" id="nav"><button data-tab="home">Bugun</button><button data-tab="course">Kurs</button><button data-tab="travel">Travel Mode</button><button data-tab="srs">SRS</button><button data-tab="errors">Xatolar</button><button data-tab="diagnostic">Diagnostika</button><button data-tab="progress">Progress</button></div>
<section id="home" class="tab"></section><section id="course" class="tab hidden"></section><section id="travel" class="tab hidden"></section>
<section id="srs" class="tab hidden"></section><section id="errors" class="tab hidden"></section><section id="diagnostic" class="tab hidden"></section><section id="progress" class="tab hidden"></section>
</main><footer>English 2H Ultimate v2 · Local progress · Browser TTS · Offline cache</footer>
<script src="app.js"></script></body></html>
