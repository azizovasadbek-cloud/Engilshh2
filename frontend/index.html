<html lang="uz">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1220"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="English Master">
<link rel="manifest" href="manifest.json"><title>English Master — Pure Focus</title>
<style>
:root{--bg:#f4f7fb;--card:#fff;--ink:#0f172a;--muted:#64748b;--line:#dbe3ee;--blue:#2563eb;--green:#15803d;--amber:#b45309;--red:#b91c1c;--dark:#0b1220}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body.pure{background:#eef3f8}
header{background:var(--dark);color:#fff;padding:16px;position:sticky;top:0;z-index:20}.top{max-width:1180px;margin:auto;display:flex;justify-content:space-between;gap:12px;align-items:center}.brand{font-weight:850;font-size:20px}.sub{font-size:12px;color:#cbd5e1;margin-top:3px}.status{font-size:13px}.wrap{max-width:1180px;margin:auto;padding:14px}.nav{display:flex;gap:7px;overflow:auto;margin-bottom:12px;position:sticky;top:69px;z-index:10;padding-bottom:4px}.nav button{white-space:nowrap}
button{border:0;border-radius:11px;padding:10px 13px;background:var(--blue);color:#fff;font-weight:750;cursor:pointer}button.secondary{background:#e2e8f0;color:#0f172a}button.green{background:var(--green)}button.amber{background:var(--amber)}button.red{background:var(--red)}button:disabled{opacity:.45;cursor:not-allowed}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:0 8px 28px #0f172a0b}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}.item{border:1px solid var(--line);border-radius:14px;padding:12px;margin:8px 0}.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:#eff6ff;color:#1d4ed8;font-size:12px;margin:2px}.big{font-size:34px;font-weight:850}.muted{color:var(--muted)}.progress{height:10px;background:#e2e8f0;border-radius:999px;overflow:hidden}.bar{height:100%;background:var(--blue)}input,select,textarea{font:inherit;width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:#fff}label{font-size:12px;color:var(--muted);display:block;margin:8px 0 5px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.hidden{display:none}.timer{font-size:42px;font-weight:900;text-align:center}.ok{color:#166534;background:#ecfdf5;padding:10px;border-radius:10px}.warn{color:#92400e;background:#fffbeb;padding:10px;border-radius:10px}.danger{color:#991b1b;background:#fef2f2;padding:10px;border-radius:10px}.dark{background:#111827;color:#fff}.dark .card,.dark .item{background:#1f2937;border-color:#374151;color:#fff}.dark .muted{color:#cbd5e1}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line);font-size:13px}small{font-size:12px}footer{text-align:center;color:var(--muted);font-size:12px;padding:26px}
.lessonHero{border-left:5px solid var(--blue)}.audioBox{border:1px solid var(--line);border-radius:14px;padding:14px;background:#f8fafc}.script{line-height:1.7;font-size:17px}.kbd{font-family:ui-monospace,monospace;background:#eef2ff;border-radius:6px;padding:2px 5px}.check{display:flex;gap:9px;align-items:flex-start;margin:8px 0}.check input{width:auto;margin-top:5px}.one{max-width:720px;margin:auto}.score{font-size:22px;font-weight:800}.gate{border:2px dashed #93c5fd;background:#eff6ff}.no-distraction{display:flex;gap:8px;align-items:center}.no-distraction input{width:auto}.wordGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:9px;margin-top:10px}.wordCard{display:flex;flex-direction:column;gap:3px;text-align:left;background:#f8fafc;color:var(--ink);border:1px solid var(--line);padding:12px;border-radius:13px}.wordCard span{font-size:12px;color:var(--muted);font-weight:500}.wordCard em{font-size:11px;color:#92400e;font-style:normal}.wordCard.hard{border:2px solid #f59e0b;background:#fffbeb}.modal{position:fixed;inset:0;background:#0b1220aa;z-index:100;display:flex;align-items:center;justify-content:center;padding:18px}.modalCard{background:#fff;max-width:480px;width:100%;border-radius:20px;padding:20px;box-shadow:0 20px 60px #0005;position:relative}.close{position:absolute;right:12px;top:12px;background:#e2e8f0;color:#0f172a;padding:7px 10px}.meaning{font-size:24px;font-weight:800}.pron{color:var(--muted)}.hardList{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0 14px}.hardChip{background:#fffbeb;border:1px solid #f59e0b;padding:7px 10px;border-radius:999px;font-size:13px}.schedule{margin-top:12px}.scheduleRow{display:grid;grid-template-columns:65px 1fr 50px 55px;gap:8px;align-items:center;padding:10px;border-bottom:1px solid var(--line)}.scheduleRow small{color:var(--muted)}button.mini{padding:6px 8px;font-size:12px}.quizItem input{margin-top:8px}
</style></head>
<body class="pure">
